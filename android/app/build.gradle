plugins {
    id "com.android.application"
}

android {
    namespace "com.whitecrow.aldrathar"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.whitecrow.aldrathar"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra -Wpedantic"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.1"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}
